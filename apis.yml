aid: elevarm
name: Elevarm
description: Elevarm is an upstream-focused agritech company founded in 2022 and headquartered in Bandung,
  Indonesia, that elevates smallholder horticulture farmers across West Java, Central Java, and Yogyakarta.
  It aggregates and supports more than 15,000 farmers with high-quality inputs (premium greenhouse seedlings,
  bio-based fertilizers, and environmentally friendly pest control via its NextBio line), lab-based soil
  testing through Klinik Tani, an AI-powered farming productivity app for land monitoring and data-driven
  agronomy recommendations, pro-farmer financing, and the PasarAgri commodity trading platform that links
  supply to business buyers. Elevarm is backed by Intudo, Insignia Ventures Partners, and 500 Global.
